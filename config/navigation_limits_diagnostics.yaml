/cirtesub/navigation_limits_diagnostics:
  ros__parameters:
    navigator_topic: /cirtesub/navigator/navigation_throttled
    frequency_topic: /cirtesub/navigator/navigation
    publish_period: 1.0
    stale_timeout: 3.0
    warn_min_frequency_hz: 10.0
    error_min_frequency_hz: 2.0
    max_depth: 4.0
    depth_warning_margin: 0.5
    min_altitude: 0.3
    altitude_warning_margin: 0.5
    center_x: 0.0
    center_y: 0.0
    max_radius: 4.0
    radius_warning_margin: 0.5
